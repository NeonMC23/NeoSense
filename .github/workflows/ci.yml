name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --all-targets --all-features
      - name: Build
        run: cargo build --release --locked
      - name: Release archive smoke test
        run: |
          ./packaging/build-release.sh /tmp/neosense-dist
          test -f /tmp/neosense-dist/SHA256SUMS
          test -f /tmp/neosense-dist/neosense-*.tar.gz

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck install.sh uninstall.sh packaging/build-release.sh
      - name: Bash syntax
        run: bash -n install.sh && bash -n uninstall.sh && bash -n packaging/build-release.sh

  systemd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify unit syntax with neutral paths
        run: |
          tmp="$(mktemp --suffix=.service)"
          sed \
            -e 's#/usr/local/bin/neosensed#/bin/true#g' \
            -e 's#/run/neosense#/tmp/neosense-verify#g' \
            -e 's#Group=neosense#Group=root#g' \
            -e 's#NEOSENSE_SOCKET_GROUP=neosense#NEOSENSE_SOCKET_GROUP=root#g' \
            packaging/neosensed.service > "$tmp"
          systemd-analyze verify "$tmp"
          rm -f "$tmp"
